<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="card">
        <div class="container">
            <form action="">
                <div class="form_container">
                    <div class="block">
                      <label for="day">
                         Day
                      </label>
                     <input type="number" id="day" placeholder="DD">
                     <small></small>
                    </div>
                    <div class="block">
                     <label for="month">
                         Month
                     </label>
                     <input type="number" id="month" placeholder="MM">
                     <small></small>
                    </div>
                    <div class="block">
                     <label for="Year">
                         Year
                     </label>
                     <input type="number" id="year" placeholder="YY">
                     <small></small>
                    </div>
                    <div class="submit_block ">
                      <hr>
                      <button type="submit" class="submit_btn"><img src="age-calculator-app-main/assets/images/icon-arrow.svg" alt=""></button>
                    </div>
                </div>
            </form>
            <div class="output">
                <h1><span id="YY">~~</span>years</h1>
                <h1><span id="MM">~~</span>months</h1>
                <h1><span id="DD">~~</span>days</h1>
            </div>
        </div>    
    </div>
    <script src="script.js"></script>
</body>
</html>
